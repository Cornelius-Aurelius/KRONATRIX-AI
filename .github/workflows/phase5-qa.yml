name: Phase 5 QA

on:
  push:
    branches:
      - kronatrix-authority-restructure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create QA output folder
        run: mkdir -p qa/lighthouse qa/screenshots

      - name: Static HTML, metadata and local-link audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlparse, unquote
          import json, re

          ROOT = Path('.').resolve()
          html_files = sorted(p for p in ROOT.rglob('*.html') if '.git' not in p.parts)
          issues=[]
          rows=[]
          canonicals={}
          titles={}

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.title=''; self.in_title=False; self.links=[]; self.assets=[]; self.meta={}; self.canonical=None; self.h1=0; self.lang=None; self.jsonld=[]; self._script_type=None; self._script=''
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='html': self.lang=a.get('lang')
                  if tag=='title': self.in_title=True
                  if tag=='a' and a.get('href'): self.links.append(a['href'])
                  if tag in ('img','script','link'):
                      key='src' if tag in ('img','script') else 'href'
                      if a.get(key): self.assets.append((tag,a[key]))
                  if tag=='meta':
                      key=a.get('name') or a.get('property')
                      if key and a.get('content') is not None: self.meta[key.lower()]=a['content']
                  if tag=='link' and (a.get('rel') or '').lower()=='canonical': self.canonical=a.get('href')
                  if tag=='h1': self.h1 += 1
                  if tag=='script' and a.get('type')=='application/ld+json': self._script_type='jsonld'; self._script=''
              def handle_endtag(self, tag):
                  if tag=='title': self.in_title=False
                  if tag=='script' and self._script_type=='jsonld':
                      self.jsonld.append(self._script); self._script_type=None; self._script=''
              def handle_data(self, data):
                  if self.in_title: self.title += data
                  if self._script_type=='jsonld': self._script += data

          def local_target(page, href):
              if not href or href.startswith(('#','mailto:','tel:','javascript:','data:')): return None
              u=urlparse(href)
              if u.scheme in ('http','https'):
                  if u.netloc not in ('kronatrix.co.uk','www.kronatrix.co.uk'): return None
                  path=unquote(u.path)
              elif u.scheme: return None
              else: path=unquote(u.path)
              if not path: return page
              if path.startswith('/'):
                  target=ROOT/path.lstrip('/')
              else:
                  target=page.parent/path
              target=Path(str(target).split('#')[0].split('?')[0])
              if target.is_dir() or str(path).endswith('/'):
                  target=target/'index.html'
              return target

          for p in html_files:
              parser=P(); text=p.read_text(encoding='utf-8', errors='replace'); parser.feed(text)
              rel=str(p.relative_to(ROOT))
              title=' '.join(parser.title.split())
              desc=parser.meta.get('description','').strip()
              row={'file':rel,'title':title,'title_len':len(title),'description_len':len(desc),'canonical':parser.canonical,'h1':parser.h1,'lang':parser.lang}
              rows.append(row)
              if not title: issues.append((rel,'ERROR','Missing title'))
              elif len(title)>70: issues.append((rel,'WARN',f'Title length {len(title)} > 70'))
              if not desc: issues.append((rel,'WARN','Missing meta description'))
              elif not 25 <= len(desc) <= 160: issues.append((rel,'WARN',f'Meta description length {len(desc)} outside 25–160'))
              if not parser.canonical: issues.append((rel,'WARN','Missing canonical'))
              else: canonicals.setdefault(parser.canonical,[]).append(rel)
              if title: titles.setdefault(title,[]).append(rel)
              if parser.h1 != 1: issues.append((rel,'WARN',f'Expected 1 H1, found {parser.h1}'))
              if parser.lang not in ('en-GB','en-gb'): issues.append((rel,'WARN',f'html lang is {parser.lang!r}, expected en-GB'))
              for js in parser.jsonld:
                  try: json.loads(js)
                  except Exception as e: issues.append((rel,'ERROR',f'Invalid JSON-LD: {e}'))
              for href in parser.links:
                  t=local_target(p,href)
                  if t is not None and not t.exists(): issues.append((rel,'ERROR',f'Broken local link: {href} -> {t.relative_to(ROOT) if ROOT in t.parents else t}'))
              for tag,src in parser.assets:
                  t=local_target(p,src)
                  if t is not None and not t.exists(): issues.append((rel,'ERROR',f'Missing local asset: {src}'))

          for c,files in canonicals.items():
              if len(files)>1: issues.append(('GLOBAL','WARN',f'Duplicate canonical {c}: {files}'))
          for t,files in titles.items():
              if len(files)>1: issues.append(('GLOBAL','WARN',f'Duplicate title {t!r}: {files}'))

          sitemap=ROOT/'sitemap.xml'
          if sitemap.exists():
              sm=sitemap.read_text(encoding='utf-8')
              urls=re.findall(r'<loc>(.*?)</loc>', sm)
              for u in urls:
                  t=local_target(ROOT/'index.html',u)
                  if t is not None and not t.exists(): issues.append(('sitemap.xml','ERROR',f'Sitemap target missing: {u}'))
          else: issues.append(('GLOBAL','ERROR','sitemap.xml missing'))

          md=['# Phase 5 static QA','',f'HTML files checked: **{len(html_files)}**','', '| File | Title len | Description len | H1 | Canonical |','|---|---:|---:|---:|---|']
          for r in rows:
              md.append(f"| `{r['file']}` | {r['title_len']} | {r['description_len']} | {r['h1']} | {r['canonical'] or '—'} |")
          md += ['', '## Findings']
          if issues:
              for f,sev,msg in issues: md.append(f'- **{sev}** `{f}` — {msg}')
          else: md.append('- No static metadata/local-link errors found.')
          Path('qa/static-report.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          Path('qa/static-report.json').write_text(json.dumps({'pages':rows,'issues':[{'file':a,'severity':b,'message':c} for a,b,c in issues]},indent=2),encoding='utf-8')
          print('\n'.join(md[-80:]))
          if any(sev=='ERROR' for _,sev,_ in issues):
              raise SystemExit('Static QA found ERROR findings')
          PY

      - name: Find Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium not found on runner.' >&2
            exit 1
          fi
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Start local preview server
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > qa/server.log 2>&1 &
          echo $! > qa/server.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat qa/server.log
          exit 1

      - name: Capture desktop and mobile screenshots
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --screenshot=qa/screenshots/home-desktop.png http://127.0.0.1:8000/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=qa/screenshots/home-mobile.png http://127.0.0.1:8000/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --screenshot=qa/screenshots/ai-seo-desktop.png http://127.0.0.1:8000/what-is-ai-seo/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=qa/screenshots/industry-mobile.png http://127.0.0.1:8000/industries/accountants/

      - name: Install Lighthouse
        run: npm install --global lighthouse@12

      - name: Run Lighthouse QA
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          set -e
          chrome_flags='--headless=new --no-sandbox --disable-gpu'
          lighthouse http://127.0.0.1:8000/ --quiet --chrome-flags="$chrome_flags" --only-categories=performance,accessibility,best-practices,seo --form-factor=desktop --screenEmulation.disabled --output=json --output-path=qa/lighthouse/home-desktop.json
          lighthouse http://127.0.0.1:8000/ --quiet --chrome-flags="$chrome_flags" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --output=json --output-path=qa/lighthouse/home-mobile.json
          lighthouse http://127.0.0.1:8000/what-is-ai-seo/ --quiet --chrome-flags="$chrome_flags" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --output=json --output-path=qa/lighthouse/ai-seo-mobile.json
          lighthouse http://127.0.0.1:8000/industries/accountants/ --quiet --chrome-flags="$chrome_flags" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --output=json --output-path=qa/lighthouse/accountants-mobile.json
          lighthouse http://127.0.0.1:8000/research/uk-ai-search-access-index/ --quiet --chrome-flags="$chrome_flags" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile --output=json --output-path=qa/lighthouse/research-mobile.json

      - name: Summarise Lighthouse results
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          rows=[]
          for p in sorted(Path('qa/lighthouse').glob('*.json')):
              d=json.loads(p.read_text())
              c=d['categories']; a=d['audits']
              def score(k): return round((c[k]['score'] or 0)*100)
              def n(k):
                  v=a.get(k,{}).get('numericValue')
                  return None if v is None else round(v,1)
              rows.append((p.stem,score('performance'),score('accessibility'),score('best-practices'),score('seo'),n('first-contentful-paint'),n('largest-contentful-paint'),n('cumulative-layout-shift'),n('total-blocking-time')))
          md=['# Phase 5 Lighthouse summary','', '| Run | Perf | A11y | Best | SEO | FCP ms | LCP ms | CLS | TBT ms |','|---|---:|---:|---:|---:|---:|---:|---:|---:|']
          for r in rows: md.append('| '+ ' | '.join(str(x) for x in r) +' |')
          md += ['', '## Review thresholds', '- Performance: target 90+', '- Accessibility: target 95+', '- Best Practices: target 95+', '- SEO: target 95+', '- CLS: target < 0.10']
          Path('qa/lighthouse-summary.md').write_text('\n'.join(md)+'\n',encoding='utf-8')
          print('\n'.join(md))
          PY

      - name: Upload Phase 5 QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-qa-${{ github.sha }}
          path: qa/
          retention-days: 7
