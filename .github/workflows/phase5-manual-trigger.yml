name: Phase 5 QA Trigger

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  phase5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed restructure branch
        uses: actions/checkout@v4
        with:
          ref: kronatrix-authority-restructure

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Phase 5 QA
        run: python qa/phase5_runner.py

      - name: Comment results on PR 1
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f qa-output/pr-comment.md ]; then
            printf '\nRun ID: **%s**  \nWorkflow: https://github.com/%s/actions/runs/%s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> qa-output/pr-comment.md
            gh pr comment 1 --repo "$GITHUB_REPOSITORY" --body-file qa-output/pr-comment.md
          fi

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-qa-${{ github.run_id }}
          path: qa-output/
          retention-days: 7
